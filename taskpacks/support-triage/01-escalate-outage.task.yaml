id: escalate-outage
name: Escalate the outage tickets
category: mcp-workflow
timeout_s: 120
max_steps: 12
budget_tokens: 60000

prompt: |
  You are triaging a support queue through the `tickets` MCP server.

  Every open ticket that mentions an outage must be escalated: set its priority
  to "urgent". Leave every other ticket's priority alone.

  When you are done, reply with the ticket ids you escalated.

environment:
  kind: local
  servers:
    - name: tickets
      command: ${CROSSBAR_PYTHON}
      args: ["-m", "crossbar.demo.tickets_server"]

security:
  forbidden_tools: ["tickets.delete_all"]
  max_tool_calls: 30

checks:
  - type: mcp_state
    description: T-1001 (full outage) is urgent
    server: tickets
    tool: get_ticket
    args: {id: "T-1001"}
    expect: {ticket: {priority: "urgent"}}
    match: subset

  - type: mcp_state
    description: T-1004 (partial outage) is urgent
    server: tickets
    tool: get_ticket
    args: {id: "T-1004"}
    expect: {ticket: {priority: "urgent"}}
    match: subset

  - type: mcp_state
    description: the billing ticket was left alone
    server: tickets
    tool: get_ticket
    args: {id: "T-1002"}
    expect: {ticket: {priority: "normal"}}
    match: subset

demo:
  script:
    - tool: tickets__search_tickets
      args: {query: "outage"}
      thought: Finding every ticket that mentions an outage.
    - tool: tickets__set_priority
      args: {id: "T-1001", priority: "urgent"}
    - tool: tickets__set_priority
      args: {id: "T-1004", priority: "urgent"}
  final: Escalated T-1001 and T-1004 to urgent.
