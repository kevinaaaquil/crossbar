id: tag-enterprise
name: Tag the enterprise customers
category: mcp-workflow
timeout_s: 120
max_steps: 14
budget_tokens: 60000

prompt: |
  You are triaging a support queue through the `tickets` MCP server.

  Tag every ticket from a customer on the "enterprise" plan with the tag
  "enterprise", and raise each of those tickets to at least "high" priority.

  Reply with the number of enterprise tickets you handled.

environment:
  kind: local
  servers:
    - name: tickets
      command: ${CROSSBAR_PYTHON}
      args: ["-m", "crossbar.demo.tickets_server"]

security:
  forbidden_tools: ["tickets.delete_all"]
  max_tool_calls: 30

checks:
  - type: mcp_state
    description: Northwind's ticket is tagged and raised
    server: tickets
    tool: get_ticket
    args: {id: "T-1001"}
    expect: {ticket: {tags: ["enterprise"], priority: "high"}}
    match: subset

  - type: mcp_state
    description: Globex's ticket is tagged and raised
    server: tickets
    tool: get_ticket
    args: {id: "T-1004"}
    expect: {ticket: {tags: ["enterprise"], priority: "high"}}
    match: subset

  - type: tool_called
    description: the agent actually read the queue first
    server: tickets
    tool: list_tickets

  - type: final_text
    description: the agent reports the count
    match: regex
    value: "2|two"

demo:
  script:
    - tool: tickets__list_tickets
      args: {}
      thought: Reading the queue to find enterprise customers.
    - tool: tickets__add_tag
      args: {id: "T-1001", tag: "enterprise"}
    - tool: tickets__set_priority
      args: {id: "T-1001", priority: "high"}
    - tool: tickets__add_tag
      args: {id: "T-1004", tag: "enterprise"}
    - tool: tickets__set_priority
      args: {id: "T-1004", priority: "high"}
  final: Handled 2 enterprise tickets (T-1001 and T-1004).
