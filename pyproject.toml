[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crossbar"
version = "0.1.0"
description = "Migration test bench: sweep models x harnesses over your MCP tasks, with statistics."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
authors = [{ name = "Eshan Singh" }]
keywords = ["llm", "agents", "evaluation", "mcp", "benchmark", "harness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pyyaml>=6",
    "httpx>=0.27",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout"]

[project.urls]
Homepage = "https://github.com/kevinaaaquil/crossbar"
Documentation = "https://github.com/kevinaaaquil/crossbar/blob/main/docs/WALKTHROUGH.md"
Issues = "https://github.com/kevinaaaquil/crossbar/issues"

[project.scripts]
crossbar = "crossbar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning"]
