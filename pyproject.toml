[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crossbar"
version = "0.1.0"
description = "Compare your own model against a frontier model on your own tasks."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
authors = [{ name = "Eshan Singh" }]
keywords = ["llm", "agents", "evaluation", "mcp", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pyyaml>=6",
    "httpx>=0.27",
    "textual>=0.80",
]

[project.optional-dependencies]
# pytest-asyncio is required: the Textual UI tests are async, and without
# it pytest cannot run them at all.
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/kevinaaaquil/crossbar"
Documentation = "https://github.com/kevinaaaquil/crossbar/blob/main/docs/WALKTHROUGH.md"
Issues = "https://github.com/kevinaaaquil/crossbar/issues"


[project.scripts]
crossbar = "crossbar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The example Test ships inside the package: people install crossbar, they do
# not clone it, so anything reachable only from the repository root does not
# exist for them.
[tool.setuptools.package-data]
crossbar = ["examples/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning"]
