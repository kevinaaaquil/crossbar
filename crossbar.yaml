# Crossbar roster: which models, which harnesses, how many repeats.
#
# Out of the box this file uses two built-in MOCK models, so `crossbar run`
# works with no API key and no network. Replace them with the real entries
# below when you are ready.

models:
  # --- built-in demo backends (no key, no network) ------------------------
  - id: mock-strong
    provider: mock
    model: mock-strong
    skill: 0.97          # how reliably it executes each step of a task
    price: {input_per_mtok: 15.0, output_per_mtok: 75.0}

  - id: mock-weak
    provider: mock
    model: mock-weak
    skill: 0.80          # misses a step now and then
    recover: 0.9         # but a self-check turn usually catches it
    price: {input_per_mtok: 0.20, output_per_mtok: 0.60}

  # --- your own fine-tuned model, over any OpenAI-compatible endpoint -----
  # (vLLM, Ollama, LM Studio, Together, Fireworks, OpenRouter, ...)
  # - id: my-finetune
  #   provider: openai
  #   model: my-org/my-finetune
  #   base_url: http://localhost:8000/v1
  #   api_key_env: LOCAL_API_KEY
  #   price: {input_per_mtok: 0.20, output_per_mtok: 0.60}

  # --- a frontier model as the baseline ----------------------------------
  # - id: opus
  #   provider: anthropic
  #   model: claude-opus-5
  #   api_key_env: ANTHROPIC_API_KEY
  #   price: {input_per_mtok: 15.0, output_per_mtok: 75.0}

  # --- Claude Code, driven through its own CLI ---------------------------
  # - id: claude-code-opus
  #   provider: claude-cli
  #   model: opus

harnesses:
  - id: react
    kind: react
  - id: react-plus-verify
    kind: react
    verify: true          # one forced self-check turn before finishing
  # - id: single-shot
  #   kind: single-shot   # control condition: one call, no tools
  # - id: claude-code
  #   kind: claude-code   # pairs only with a provider: claude-cli model

# Leave `agents` out and crossbar sweeps every compatible model x harness pair.
# agents:
#   - {model: my-finetune, harness: react-plus-verify}
#   - {model: opus, harness: react}

run:
  repeats: 5              # rollouts per cell per task; 5+ stabilises the estimate
  seed: 0                 # same seed, same sweep
  concurrency: 4
  baseline: mock-strong+react   # the thing you are considering moving away from
  results_dir: runs
