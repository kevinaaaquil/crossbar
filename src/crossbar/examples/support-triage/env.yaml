# Where the Task runs, and what the agent is allowed to touch.
kind: local          # 'local' runs the servers as subprocesses here.
                     # 'docker' runs them in a throwaway container:
                     #   kind: docker
                     #   image: your-image:latest

connectors:
  mcp:
    servers:
      - name: tickets
        command: ${CROSSBAR_PYTHON}      # always the interpreter running crossbar
        args: ["-m", "crossbar.demo.tickets_server"]
