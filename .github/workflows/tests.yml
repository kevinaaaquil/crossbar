name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # The suite needs no network, no API key and no Docker daemon. If this
      # step ever starts needing one, that is a bug in the change, not the CI.
      - name: Run the test suite
        run: python -m pytest -q

      - name: Check the bundled demo still produces a verdict
        run: |
          python -m crossbar.cli validate
          python -m crossbar.cli run --repeats 1 --out "$RUNNER_TEMP/runs" --quiet
