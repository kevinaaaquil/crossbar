# The models you are comparing, and the role each one holds.
#
# Roles are labels. They do not change how a Task runs. They mean exactly two
# things: the candidate's attempts run first, and the baseline judges when no
# judge is assigned.

models:
  # Your model. Any OpenAI-compatible endpoint works — vLLM, Ollama, LM Studio,
  # Together, Fireworks, OpenRouter, or your own server.
  - id: my-model
    provider: openai
    model: qwen3
    base_url: http://localhost:8000/v1
    api_key_env: LOCAL_API_KEY        # the NAME of an env var, never the key
    price: {input_per_mtok: 0.20, output_per_mtok: 0.60}

  # The frontier model you are comparing against.
  - id: frontier
    provider: anthropic
    model: claude-opus-5
    api_key_env: ANTHROPIC_API_KEY
    price: {input_per_mtok: 15.0, output_per_mtok: 75.0}

roles:
  candidate: my-model
  baseline: frontier
  # judge: frontier      # optional. Falls back to the baseline, which means it
  #                      # grades its own attempts — blinded, but a conflict of
  #                      # interest. Connect a third model for a real decision.
